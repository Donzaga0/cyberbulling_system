{% extends 'base.html' %}{% block content %}<section class="auth-page"><div class="auth-card wide"><div class="auth-side"><i class="bi bi-person-plus"></i><h2>Join SafeText AI</h2><p>Create an account to detect harmful messages and keep a private prediction history.</p></div><div class="auth-form"><h2>Create Account</h2><form method="post"><div class="row g-3"><div class="col-md-6"><label>Full Name</label><input name="fullname" required></div><div class="col-md-6"><label>Username</label><input name="username" required></div><div class="col-12"><label>Email Address</label><input type="email" name="email" required></div><div class="col-md-6"><label>Password</label><input type="password" name="password" required></div><div class="col-md-6"><label>Confirm Password</label><input type="password" name="confirm_password" required></div></div><button class="btn btn-primary w-100 mt-4">Create Account</button></form><p class="text-center mt-3">Already registered? <a href="/login">Login</a></p></div></div></section>{% endblock %}
