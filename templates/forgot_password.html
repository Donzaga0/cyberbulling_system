{% extends 'base.html' %}{% block content %}<section class="auth-page"><div class="auth-form standalone"><h2>Forgot Password</h2><p>Enter your registered email to create a secure reset link.</p><form method="post"><label>Email Address</label><input type="email" name="email" required><button class="btn btn-primary w-100 mt-3">Generate Reset Link</button></form>{% if reset_link %}<div class="alert alert-info mt-4"><strong>Local development reset link:</strong><br><a href="{{reset_link}}">Reset Password</a></div>{% endif %}<a href="/login">← Back to login</a></div></section>{% endblock %}
