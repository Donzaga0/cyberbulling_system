{% extends 'user_base.html' %}{% block app_content %}<div class="page-head"><div><span>ACCOUNT SETTINGS</span><h2>User Profile</h2></div></div><div class="panel"><form method="post"><div class="row g-4"><div class="col-md-6"><label>Full Name</label><input name="fullname" value="{{user.fullname or ''}}" required></div><div class="col-md-6"><label>Username</label><input value="{{user.username}}" disabled></div><div class="col-md-6"><label>Email</label><input type="email" name="email" value="{{user.email or ''}}" required></div><div class="col-md-6"><label>Phone Number</label><input name="phone" value="{{user.phone or ''}}"></div><div class="col-12"><label>Short Bio</label><textarea name="bio" rows="4">{{user.bio or ''}}</textarea></div></div><button class="btn btn-primary mt-4">Save Changes</button></form></div>{% endblock %}
