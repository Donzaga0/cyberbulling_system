{% extends 'base.html' %}
{% block content %}
<div class="app-shell">
    <aside class="sidebar admin-side">
        <div class="side-user">
            <div class="avatar"><i class="bi bi-person-gear"></i></div>
            <strong>Administrator</strong>
            <small>System Control</small>
        </div>
        <a href="/admin" class="{% if request.path == '/admin' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i> Dashboard
        </a>
        <a href="/users" class="{% if request.path == '/users' %}active{% endif %}">
            <i class="bi bi-people"></i> Registered Users
        </a>
        <a href="/admin/predictions" class="{% if request.path == '/admin/predictions' %}active{% endif %}">
            <i class="bi bi-chat-left-text"></i> All Predictions
        </a>
        <a href="/detect" class="{% if request.path == '/detect' %}active{% endif %}">
            <i class="bi bi-search"></i> Test Detector
        </a>
        <a href="/about" class="{% if request.path == '/about' %}active{% endif %}">
            <i class="bi bi-info-circle"></i> About Project
        </a>
        <hr style="border-color: rgba(255,255,255,0.15); margin: 1.5rem 0;">
        <a href="/logout" class="text-danger">
            <i class="bi bi-box-arrow-left text-danger"></i> Logout
        </a>
    </aside>
    <section class="app-content">
        {% block admin_content %}{% endblock %}
    </section>
</div>
{% endblock %}
