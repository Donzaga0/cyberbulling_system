{% extends 'user_base.html' %}{% block app_content %}<div class="page-head"><div><span>MESSAGE ANALYSIS</span><h2>Detect Harmful Content</h2><p>Enter any online message for NLP-based classification.</p></div></div><div class="panel detect-panel"><form method="post"><label class="form-label fw-semibold">Message to Analyse</label><textarea name="message" rows="8" maxlength="3000" placeholder="Type or paste a social media post, chat, comment, or message here..." required></textarea><div class="detect-footer"><small><i class="bi bi-lock"></i> Your result is stored securely in your history.</small><button class="btn btn-primary btn-lg"><i class="bi bi-cpu"></i> Analyse Message</button></div></form></div><div class="row g-3 mt-3">{% for k,v in label_info.items() %}<div class="col-md-6 col-xl-4"><div class="mini-category"><i class="bi {{v.icon}}"></i><span>{{v.name}}</span></div></div>{% endfor %}</div>{% endblock %}
