{% extends 'admin_base.html' %}{% block admin_content %}<div class="page-head"><div><span>USER MANAGEMENT</span><h2>Registered Users</h2></div></div><div class="panel"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>Name</th><th>Username</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead><tbody>{% for u in users %}<tr><td>{{u.fullname or '—'}}</td><td>{{u.username}}</td><td>{{u.email}}</td><td><span class="label-pill safe">{{u.role}}</span></td><td>{{u.created_at or '—'}}</td></tr>{% endfor %}</tbody></table></div></div>{% endblock %}
